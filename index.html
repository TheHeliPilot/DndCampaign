<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DM Screen - Campaign Manager</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/entities.css">
    <link rel="stylesheet" href="css/icons.css">
</head>
<body>
<div id="app">
    <header class="app-header">
        <div class="header-left">
            <h1 class="app-title"><i class="icon icon-crossed-swords"></i> DM Screen</h1>
            <span class="campaign-name" id="campaignName">Untitled Campaign</span>
        </div>
        <div class="header-center">
            <div class="time-display" id="timeDisplay">
                <span class="current-date"></span>
                <span class="time-of-day"></span>
            </div>
        </div>
        <div class="header-right">
            <button class="btn btn-icon" id="quickSearchBtn" title="Quick Search (Ctrl+K)"><i class="icon icon-search"></i></button>
        </div>
    </header>

    <nav class="main-nav">
        <button class="nav-tab active" data-tab="dashboard"><i class="icon icon-grid"></i> Dashboard</button>
        <button class="nav-tab" data-tab="pcs"><i class="icon icon-npcs"></i> PCs</button>
        <button class="nav-tab" data-tab="npcs"><i class="icon icon-npcs"></i> NPCs</button>
        <button class="nav-tab" data-tab="locations"><i class="icon icon-locations"></i> Locations</button>
        <button class="nav-tab" data-tab="shops"><i class="icon icon-shops"></i> Shops</button>
        <button class="nav-tab" data-tab="quests"><i class="icon icon-quests"></i> Quests</button>
        <button class="nav-tab" data-tab="items"><i class="icon icon-items"></i> Items</button>
        <button class="nav-tab" data-tab="lore"><i class="icon icon-lore"></i> Lore</button>
        <button class="nav-tab" data-tab="maps"><i class="icon icon-maps"></i> Maps</button>
        <button class="nav-tab" data-tab="tools"><i class="icon icon-dice"></i> Tools</button>
    </nav>

    <main class="main-content">
        <section class="tab-content active" id="tab-dashboard">
            <div class="dashboard-grid">
                <div class="panel dashboard-time">
                    <div class="panel-header"><h2>Time & Date</h2></div>
                    <div class="panel-content" id="dashboardTime"></div>
                </div>
                <div class="panel dashboard-weather">
                    <div class="panel-header"><h2>Weather</h2></div>
                    <div class="panel-content" id="dashboardWeather"></div>
                </div>
                <div class="panel dashboard-quests">
                    <div class="panel-header"><h2>Active Quests</h2></div>
                    <div class="panel-content" id="dashboardQuests"></div>
                </div>
                <div class="panel dashboard-party">
                    <div class="panel-header">
                        <h2>Party</h2>
                        <button class="btn btn-small" id="editPartyBtn">Edit</button>
                    </div>
                    <div class="panel-content" id="dashboardParty"></div>
                </div>
                <div class="panel dashboard-notes">
                    <div class="panel-header"><h2>Session Notes</h2></div>
                    <div class="panel-content">
                        <textarea id="sessionNotes" placeholder="Quick notes for this session..."></textarea>
                    </div>
                </div>
                <div class="panel dashboard-recent">
                    <div class="panel-header"><h2>Recent Activity</h2></div>
                    <div class="panel-content" id="dashboardRecent"></div>
                </div>
            </div>
        </section>

        <section class="tab-content" id="tab-pcs">
            <div class="entity-view">
                <div class="entity-toolbar">
                    <div class="search-box"><input type="text" id="pcSearch" placeholder="Search Player Characters..."></div>
                    <div class="filter-group">
                        <select id="pcFilterStatus">
                            <option value="">All Statuses</option>
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                            <option value="dead">Dead</option>
                            <option value="retired">Retired</option>
                        </select>
                        <select id="pcFilterClass">
                            <option value="">All Classes</option>
                            <option value="Barbarian">Barbarian</option>
                            <option value="Bard">Bard</option>
                            <option value="Cleric">Cleric</option>
                            <option value="Druid">Druid</option>
                            <option value="Fighter">Fighter</option>
                            <option value="Paladin">Paladin</option>
                            <option value="Ranger">Ranger</option>
                            <option value="Rogue">Rogue</option>
                            <option value="Sorcerer">Sorcerer</option>
                            <option value="Warlock">Warlock</option>
                            <option value="Wizard">Wizard</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" id="addPcBtn">+ Add PC</button>
                </div>
                <div class="entity-list" id="pcList"></div>
            </div>
        </section>

        <section class="tab-content" id="tab-npcs">
            <div class="entity-view">
                <div class="entity-toolbar">
                    <div class="search-box"><input type="text" id="npcSearch" placeholder="Search NPCs..."></div>
                    <div class="filter-group">
                        <select id="npcFilterDisposition">
                            <option value="">All Dispositions</option>
                            <option value="friendly">Friendly</option>
                            <option value="neutral">Neutral</option>
                            <option value="hostile">Hostile</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" id="addNpcBtn">+ Add NPC</button>
                </div>
                <div class="entity-list" id="npcList"></div>
            </div>
        </section>

        <section class="tab-content" id="tab-locations">
            <div class="entity-view">
                <div class="entity-toolbar">
                    <div class="search-box"><input type="text" id="locationSearch" placeholder="Search Locations..."></div>
                    <div class="filter-group">
                        <select id="locationFilterType">
                            <option value="">All Types</option>
                            <option value="City">City</option>
                            <option value="Town">Town</option>
                            <option value="Village">Village</option>
                            <option value="Dungeon">Dungeon</option>
                            <option value="Landmark">Landmark</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" id="addLocationBtn">+ Add Location</button>
                </div>
                <div class="entity-list" id="locationList"></div>
            </div>
        </section>

        <section class="tab-content" id="tab-shops">
            <div class="entity-view">
                <div class="entity-toolbar">
                    <div class="search-box"><input type="text" id="shopSearch" placeholder="Search Shops..."></div>
                    <div class="filter-group">
                        <select id="shopFilterType">
                            <option value="">All Types</option>
                            <option value="Tavern">Tavern</option>
                            <option value="Blacksmith">Blacksmith</option>
                            <option value="Magic Shop">Magic Shop</option>
                            <option value="General Store">General Store</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" id="addShopBtn">+ Add Shop</button>
                </div>
                <div class="entity-list" id="shopList"></div>
            </div>
        </section>

        <section class="tab-content" id="tab-quests">
            <div class="entity-view">
                <div class="entity-toolbar">
                    <div class="search-box">
                        <input type="text" id="questSearch" placeholder="Search Quests...">
                    </div>
                    <div class="filter-group">
                        <select id="questFilterStatus">
                            <option value="">All Statuses</option>
                            <option value="Not Started">Not Started</option>
                            <option value="Available">Available</option>
                            <option value="Active">Active</option>
                            <option value="Completed">Completed</option>
                        </select>
                        <div class="view-toggle">
                            <button class="btn active" id="questViewList" title="List View"><i class="icon icon-list"></i> List</button>
                            <button class="btn" id="questViewGraph" title="Graph View"><i class="icon icon-maps"></i> Graph</button>
                        </div>
                    </div>
                    <button class="btn btn-primary" id="addQuestBtn">+ Add Quest</button>
                </div>

                <div class="entity-list" id="questList"></div>

                <div id="questGraphContainer" class="hidden">
                    <div id="questNetwork"></div>
                    <div class="graph-legend">
                        <div class="legend-item"><span class="dot type-main"></span>Main</div>
                        <div class="legend-item"><span class="dot type-side"></span>Side</div>
                        <div class="legend-item"><span class="dot type-personal"></span>Personal</div>
                        <div class="legend-item"><span class="dot type-faction"></span>Faction</div>
                        <div class="legend-item"><span class="dot status-completed"></span>Completed</div>
                    </div>
                    <div class="graph-controls">
                        <button class="btn btn-small" id="graphFit">Reset View</button>
                        <button class="btn btn-small" id="graphPhysics">Stabilize</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="tab-content" id="tab-items">
            <div class="entity-view">
                <div class="entity-toolbar">
                    <div class="search-box"><input type="text" id="itemSearch" placeholder="Search Items..."></div>
                    <div class="filter-group">
                        <select id="itemFilterType">
                            <option value="">All Types</option>
                            <option value="Weapon">Weapon</option>
                            <option value="Armor">Armor</option>
                            <option value="Potion">Potion</option>
                            <option value="Wondrous Item">Wondrous Item</option>
                        </select>
                        <select id="itemFilterRarity">
                            <option value="">All Rarities</option>
                            <option value="Common">Common</option>
                            <option value="Uncommon">Uncommon</option>
                            <option value="Rare">Rare</option>
                            <option value="Legendary">Legendary</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" id="addItemBtn">+ Add Item</button>
                </div>
                <div class="entity-list" id="itemList"></div>
            </div>
        </section>

        <section class="tab-content" id="tab-lore">
            <div class="entity-view">
                <div class="entity-toolbar">
                    <div class="search-box"><input type="text" id="loreSearch" placeholder="Search Lore..."></div>
                    <button class="btn btn-primary" id="addLoreBtn">+ Add Lore</button>
                </div>
                <div class="entity-list" id="loreList"></div>
            </div>
        </section>

        <section class="tab-content" id="tab-maps">
            <div class="maps-view">
                <div class="maps-sidebar">
                    <div class="maps-toolbar">
                        <button class="btn btn-primary" id="addMapBtn">+ Add Map</button>
                    </div>
                    <div class="maps-list" id="mapsList"></div>
                </div>
                <div class="maps-canvas-container">
                    <div class="maps-canvas-toolbar" id="mapToolbar">
                        <button class="btn btn-small" id="mapZoomIn" title="Zoom In"><i class="icon icon-plus"></i></button>
                        <button class="btn btn-small" id="mapZoomOut" title="Zoom Out"><i class="icon icon-minus"></i></button>
                        <button class="btn btn-small" id="mapReset" title="Reset View"><i class="icon icon-refresh"></i></button>
                        <span class="separator"></span>
                        <button class="btn btn-small map-tool active" data-tool="pan" title="Pan"><i class="icon icon-pan"></i></button>
                        <button class="btn btn-small map-tool" data-tool="pin" title="Add Pin"><i class="icon icon-pin"></i></button>
                    </div>
                    <div class="maps-canvas" id="mapCanvas">
                        <div class="map-placeholder">Select or add a map to begin</div>
                    </div>
                </div>
            </div>
        </section>

        <section class="tab-content" id="tab-tools">
            <div class="tools-grid">
                <div class="panel tool-dice">
                    <div class="panel-header"><h2>Dice Roller</h2></div>
                    <div class="panel-content">
                        <div class="dice-buttons">
                            <button class="dice-btn" data-dice="d4">d4</button>
                            <button class="dice-btn" data-dice="d6">d6</button>
                            <button class="dice-btn" data-dice="d8">d8</button>
                            <button class="dice-btn" data-dice="d10">d10</button>
                            <button class="dice-btn" data-dice="d12">d12</button>
                            <button class="dice-btn" data-dice="d20">d20</button>
                            <button class="dice-btn" data-dice="d100">d100</button>
                        </div>
                        <div class="dice-custom">
                            <input type="text" id="customDice" placeholder="e.g., 2d6+3">
                            <button class="btn" id="rollCustomDice">Roll</button>
                        </div>
                        <div class="dice-result" id="diceResult"></div>
                        <div class="dice-history" id="diceHistory"></div>
                    </div>
                </div>
                <div class="panel tool-initiative">
                    <div class="panel-header">
                        <h2>Initiative Tracker</h2>
                        <div class="panel-actions">
                            <button class="btn btn-small" id="addCombatant">+ Add</button>
                            <button class="btn btn-small" id="clearInitiative">Clear</button>
                        </div>
                    </div>
                    <div class="panel-content">
                        <div class="initiative-list" id="initiativeList"></div>
                        <div class="initiative-controls">
                            <button class="btn" id="nextTurn">Next Turn</button>
                            <button class="btn" id="prevTurn">Prev Turn</button>
                            <span class="round-counter">Round: <span id="roundCount">1</span></span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
        <div class="modal-header">
            <h2 class="modal-title" id="modalTitle">Modal Title</h2>
            <button class="modal-close" id="modalClose">×</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer" id="modalFooter"></div>
    </div>
</div>

<div class="quick-search-overlay" id="quickSearchOverlay">
    <div class="quick-search">
        <input type="text" id="quickSearchInput" placeholder="Search everything...">
        <div class="quick-search-results" id="quickSearchResults"></div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/ui.js"></script>
<script src="js/entities.js"></script>
<script src="js/quest-graph.js"></script>
<script src="js/maps.js"></script>
<script src="js/tools.js"></script>
<script src="js/app.js"></script>
</body>
</html>
