<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaign Quest Visualizer</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: #2d2d2d;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #404040;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
        }

        h1 { margin: 0; font-size: 1.2rem; color: #fff; }

        .controls { display: flex; gap: 10px; align-items: center; }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #45a049; }
        button.secondary { background-color: #555; }
        button.secondary:hover { background-color: #666; }

        input[type="file"] { display: none; }
        .file-upload {
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            background: #333;
        }

        #main-container {
            display: flex;
            flex: 1;
            position: relative;
            height: calc(100vh - 60px);
        }

        #mynetwork {
            flex-grow: 1;
            background: #222;
            height: 100%;
        }

        #details-panel {
            width: 400px;
            background-color: #2d2d2d;
            border-left: 1px solid #404040;
            padding: 20px;
            overflow-y: auto;
            box-shadow: -2px 0 5px rgba(0,0,0,0.3);
            transform: translateX(0);
            transition: transform 0.3s ease;
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            z-index: 5;
        }

        #details-panel.hidden {
            transform: translateX(100%);
        }

        .panel-content h2 { margin-top: 0; color: #4CAF50; border-bottom: 1px solid #555; padding-bottom: 10px;}
        .meta-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            margin-right: 5px;
            margin-bottom: 10px;
            background: #444;
        }
        .tag-main { background: #5D4037; color: #ffb74d; border: 1px solid #ffb74d; }
        .tag-side { background: #0D47A1; color: #90caf9; border: 1px solid #90caf9; }
        .tag-status { font-weight: bold; }

        .section { margin-top: 20px; }
        .section h3 { font-size: 1rem; color: #aaa; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;}
        .objective { display: flex; align-items: start; margin-bottom: 5px; }
        .checkbox { margin-right: 10px; }

        .spoiler-box {
            background: #1e1e1e;
            border: 1px solid #d32f2f;
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
        }
        .spoiler-header { color: #e57373; font-weight: bold; cursor: pointer; user-select: none;}
        .spoiler-content { display: none; margin-top: 10px; color: #ccc; }
        .spoiler-content.visible { display: block; }

        /* Legend */
        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(45, 45, 45, 0.9);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #555;
            pointer-events: none;
        }
        .legend-item { display: flex; align-items: center; margin: 5px 0; font-size: 0.8rem; }
        .dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; display: inline-block; }
    </style>
</head>

<header>

    </div>
    <div class="controls">

    </div>
</header>

<div id="main-container">

    // --- VISUALIZATION LOGIC ---

    let network = null;
    let allNodes = [];
    let allEdges = [];

    // Colors
    const colors = {
        Main: { bg: "#FFD700", border: "#FFF", highlight: "#FFED85" },
        Side: { bg: "#97C2FC", border: "#FFF", highlight: "#D2E5FF" },
        Personal: { bg: "#E0B0FF", border: "#FFF", highlight: "#EFD9FF" },
        Faction: { bg: "#C2FABC", border: "#FFF", highlight: "#E3FCE0" },
        Other: { bg: "#CCCCCC", border: "#FFF", highlight: "#EEEEEE" },
        Completed: { bg: "#666666", border: "#999999", highlight: "#888888" }
    };

    function getType(quest) {
        if (quest.type === 'Bounty') return 'Side';
        if (quest.type === 'Errand') return 'Other';
        return quest.type || 'Other';
    }

    function buildData(quests) {
        const nodes = [];
        const edges = [];
        const ids = new Set();

        quests.forEach(q => {
            ids.add(q.id);
            let type = getType(q);
            let colorSet = colors[type] || colors.Other;

            // Override for completed
            if (q.status === "Completed") {
                colorSet = colors.Completed;
            }

            nodes.push({
                id: q.id,
                label: q.name,
                title: q.type, // Tooltip
                color: {
                    background: colorSet.bg,
                    border: colorSet.border,
                    highlight: { background: colorSet.highlight, border: colorSet.border }
                },
                borderWidth: 2,
                shadow: true,
                shape: 'box',
                margin: 10,
                font: { size: 16, face: 'Segoe UI', color: q.status === "Completed" ? "#aaa" : "#000" },
                data: q // Store full quest data
            });

            // Edges based on prerequisites
            if (q.prerequisiteIds && q.prerequisiteIds.length > 0) {
                q.prerequisiteIds.forEach(targetId => {
                    // Note: Prerequisite means Target must be done BEFORE current.
                    // Flow usually visualized: Prereq -> Quest.
                    // So if A is prereq for B, arrow A -> B.
                    // The data structure says "prerequisiteIds": ["quest_main_session2"] for Quest 1?
                    // Wait, let's check the data.
                    // quest_main_session2 has prereq session1.
                    // Wait, in my extracted data:
                    // Session 2 has prereq: session1.
                    // So Session 1 -> Session 2.
                    // Correct arrow: From Prereq TO Current Quest.

                    // Only add edge if target exists in data
                    // We need to verify if the IDs match what's in the file
                    // Sometimes IDs in prereqs might not exist if they are future placeholders

                    edges.push({
                        from: targetId,
                        to: q.id,
                        arrows: 'to',
                        color: { color: '#666', opacity: 0.6 },
                        width: 1
                    });
                });
            }
        });

        // Filter edges where nodes don't exist (to prevent errors)
        const filteredEdges = edges.filter(e => ids.has(e.from) && ids.has(e.to));

        return { nodes, edges: filteredEdges };
    }

    function initNetwork(quests) {
        const data = buildData(quests);
        const container = document.getElementById('mynetwork');

        const options = {
            layout: {
                hierarchical: {
                    enabled: false, // Start with physics layout for web-like feel
                    direction: 'LR',
                    sortMethod: 'directed'
                }
            },
            physics: {
                enabled: true,
                barnesHut: {
                    gravitationalConstant: -2000,
                    centralGravity: 0.3,
                    springLength: 95,
                    springConstant: 0.04,
                    damping: 0.09,
                    avoidOverlap: 0.1
                },
                stabilization: { iterations: 150 }
            },
            interaction: { hover: true, tooltipDelay: 200 }
        };

        network = new vis.Network(container, data, options);

        network.on("click", function (params) {
            if (params.nodes.length > 0) {
                const nodeId = params.nodes[0];
                const nodeData = data.nodes.find(n => n.id === nodeId).data;
                showDetails(nodeData);
            } else {
                closePanel();
            }
        });
    }

    function showDetails(quest) {
        const panel = document.getElementById('details-panel');
        const content = document.getElementById('panel-content');

        let statusColor = "#888";
        if(quest.status === "Active") statusColor = "#4CAF50";
        if(quest.status === "Completed") statusColor = "#9E9E9E";

        let html = `
            <h2>${quest.name}</h2>
            <div>
                <span class="meta-tag tag-main">${quest.type}</span>
                <span class="meta-tag tag-status" style="color:${statusColor}">${quest.status}</span>
            </div>

            <div class="section">
                <h3>Description</h3>
                <p>${quest.description || "No description."}</p>
            </div>

            <div class="section">
                <h3>Objectives</h3>
                ${(quest.objectives || []).map(obj => `
                    <div class="objective">
                        <span class="checkbox">${obj.completed ? "☑" : "☐"}</span>
                        <span>${obj.text}</span>
                    </div>
                `).join('')}
            </div>

            <div class="section">
                <h3>Rewards</h3>
                <p>${quest.rewards || "None listed."}</p>
            </div>
        `;

        if (quest.runGuide || quest.secrets) {
            html += `
                <div class="spoiler-box">
                    <div class="spoiler-header" onclick="this.nextElementSibling.classList.toggle('visible')">
                        ⚠ DM SECRETS (Click to Show)
                    </div>
                    <div class="spoiler-content">
                        ${quest.runGuide ? `<p><strong>Guide:</strong><br>${quest.runGuide.replace(/\n/g, '<br>')}</p>` : ''}
                        ${quest.secrets ? `<p><strong>Secrets:</strong><br>${quest.secrets}</p>` : ''}
                    </div>
                </div>
            `;
        }

        content.innerHTML = html;
        panel.classList.remove('hidden');
    }

    function closePanel() {
        document.getElementById('details-panel').classList.add('hidden');
    }

    function togglePhysics() {
        const btn = document.getElementById('physicsBtn');
        if (network.physics.physicsEnabled) {
            network.setOptions({ physics: false });
            btn.innerText = "Unfreeze Layout";
        } else {
            network.setOptions({ physics: true });
            btn.innerText = "Freeze Layout";
        }
    }

    function fitView() {
        network.fit({ animation: true });
    }

    // --- FILE HANDLING ---

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const json = JSON.parse(e.target.result);
                if (json.quests) {
                    initNetwork(json.quests);
                    document.getElementById('file-name').innerText = `Loaded: ${file.name}`;
                } else {
                    alert("Invalid file format: No 'quests' array found.");
                }
            } catch (err) {
                alert("Error parsing JSON: " + err.message);
            }
        };
        reader.readAsText(file);
    });

    // --- INIT DEFAULT ---
    // Start with the embedded data immediately
    initNetwork(defaultQuests);

</script>
</body>
</html>
